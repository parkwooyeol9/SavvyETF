<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>ACWI 종목 분석기</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
/* 화면 구성: 상단 요약 → 탭(시장 개요 / 스크리너 / 종목 상세 / MSCI 편출입 / 데이터 점검).
   색: 상승 빨강·하락 파랑(국내 관례). 팩터 스코어보드(index.html)와 같은 토큰. */
:root {
  --bg: #eef2f1; --surface: #ffffff; --surface-2: #f6f8f8; --ink: #14212a; --muted: #5a6a72; --line: #d6dfdf;
  --accent: #0d5c63; --accent-ink: #ffffff; --pos: #c4162f; --neg: #1f5fbf; --warn: #a86400; --c3: #7a4fb3; --c4: #2f8a4e;
  --f-display: "Noto Serif KR", "Apple SD Gothic Neo", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1315; --surface: #141c1f; --surface-2: #19232a; --ink: #e3eaea; --muted: #8fa0a6; --line: #26343a;
  --accent: #52b5b0; --accent-ink: #06201f; --pos: #ff6f6f; --neg: #72a9ff; --warn: #e7a43a; --c3: #b592e8; --c4: #63c483; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d1315; --surface: #141c1f; --surface-2: #19232a; --ink: #e3eaea; --muted: #8fa0a6; --line: #26343a;
  --accent: #52b5b0; --accent-ink: #06201f; --pos: #ff6f6f; --neg: #72a9ff; --warn: #e7a43a; --c3: #b592e8; --c4: #63c483; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-body); margin: 0 }
.wrap { max-width: 1480px; margin: 0 auto; padding-inline: 20px; padding-block: 20px 48px }
@media (max-width: 600px) { .wrap { padding-inline: 16px } }
h1, h2, h3 { text-wrap: balance; margin: 0 }
h1 { font: 700 26px/1.2 var(--f-display); letter-spacing: -0.01em }
h2 { font: 600 16px/1.3 var(--f-body) }
h3 { font: 600 13px/1.3 var(--f-body); color: var(--muted) }
p { margin: 0 }
.num, td.n, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums }
.muted { color: var(--muted) }
.small { font-size: 12px }
.eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600 }
a { color: var(--accent) }
header.top { display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-end; justify-content: space-between; padding-bottom: 16px; border-bottom: 1px solid var(--line) }
.links { display: flex; gap: 12px; font-size: 13px; margin-top: 6px; flex-wrap: wrap }
.facts { display: flex; flex-wrap: wrap; gap: 8px 24px }
.fact { display: grid; gap: 2px }
.fact b { font: 500 18px/1.1 var(--f-mono); font-variant-numeric: tabular-nums }
nav.tabs { display: flex; gap: 4px; margin-block: 16px; overflow-x: auto }
nav.tabs button { font: 600 14px var(--f-body); color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 12px; cursor: pointer; white-space: nowrap }
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent) }
button:focus-visible, input:focus-visible, select:focus-visible, tr:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0 }
.card > h2 { margin-bottom: 4px }
.card > .sub { color: var(--muted); font-size: 12px; margin-bottom: 10px }
.grid { display: grid; gap: 16px }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)) }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)) }
@media (max-width: 1100px) { .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)) } }
@media (max-width: 760px) { .g2, .g3 { grid-template-columns: minmax(0, 1fr) } }
.screener { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 16px; align-items: start }
@media (max-width: 960px) { .screener { grid-template-columns: minmax(0, 1fr) } }
aside.ctl { display: grid; gap: 14px; position: sticky; top: 12px }
@media (max-width: 960px) { aside.ctl { position: static } }
.field { display: grid; gap: 5px }
.field label, .field .lab { font-size: 12px; color: var(--muted); font-weight: 600 }
input[type="search"], select { width: 100%; font: 14px var(--f-body); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 7px 9px }
.wrow { display: grid; grid-template-columns: 52px minmax(0, 1fr) 34px; gap: 6px; align-items: center; font-size: 12px }
.wrow input { width: 100%; accent-color: var(--accent) }
.wrow output { font: 11px var(--f-mono); text-align: right; color: var(--muted) }
.btn { font: 600 13px var(--f-body); border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: var(--r); padding: 6px 10px; cursor: pointer }
.seg { display: flex; flex-wrap: wrap; gap: 6px }
.seg button { font: 12px var(--f-body); border: 1px solid var(--line); background: none; color: var(--muted); border-radius: 999px; padding: 3px 10px; cursor: pointer }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.tablebox { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); min-width: 0 }
.tablehead { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--line) }
.scroll { overflow: auto; max-height: 70vh }
.scroll.short { max-height: 420px }
table { border-collapse: collapse; width: 100%; font-size: 13px }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap }
th { font-size: 11px; font-weight: 600; color: var(--muted); position: sticky; top: 0; background: var(--surface); cursor: pointer; user-select: none; z-index: 1 }
th.n, td.n { text-align: right }
th[data-dir="desc"]::after { content: " ▼"; font-size: 9px }
th[data-dir="asc"]::after { content: " ▲"; font-size: 9px }
tbody tr.click { cursor: pointer }
tbody tr.click:hover { background: color-mix(in srgb, var(--accent) 7%, transparent) }
td.name { max-width: 240px; overflow: hidden; text-overflow: ellipsis }
td.name small { display: block; color: var(--muted); font: 11px var(--f-mono) }
.pos { color: var(--pos) } .neg { color: var(--neg) } .warn { color: var(--warn) }
.badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap }
.badge.on { border-color: var(--accent); color: var(--accent) }
.badge.del { border-color: var(--pos); color: var(--pos) }
.badge.w { border-color: var(--warn); color: var(--warn) }
.heat { font-family: var(--f-mono); font-variant-numeric: tabular-nums; text-align: right }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px }
.kpi { background: var(--surface-2); border-radius: var(--r); padding: 8px 10px }
.kpi > span { display: block; font-size: 11px; color: var(--muted) }
.kpi b { font: 500 16px/1.25 var(--f-mono); font-variant-numeric: tabular-nums }
.kpi > small { display: block; font-size: 11px; color: var(--muted); margin-top: 2px }
.chart { width: 100%; position: relative }
.chart svg { display: block; width: 100%; overflow: visible }
.chart .tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 4px 7px; font: 11px/1.4 var(--f-mono); white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.12); display: none; z-index: 3 }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin-top: 6px }
.legend i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 5px; border-radius: 2px }
.bars { display: grid; gap: 6px }
.bar { display: grid; grid-template-columns: 70px minmax(0, 1fr) 48px; gap: 8px; align-items: center; font-size: 12px }
.bar .track { position: relative; height: 12px; background: var(--surface-2); border-radius: 3px }
.bar .track::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--line) }
.bar .fill { position: absolute; top: 0; bottom: 0; border-radius: 3px }
.range { position: relative; height: 8px; background: var(--surface-2); border-radius: 4px; margin: 10px 0 4px }
.range i { position: absolute; top: -4px; width: 3px; height: 16px; background: var(--ink); border-radius: 2px }
.note { font-size: 12px; color: var(--muted); line-height: 1.6 }
.note li { margin-bottom: 4px }
.lists { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px }
.lists .card { overflow: hidden }
.mini td.name { max-width: 190px }
.mini td { padding: 4px 6px; font-size: 12px }
.detail-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; align-items: flex-start }
.detail-head h2 { font: 700 22px/1.25 var(--f-display) }
.pick { display: flex; gap: 8px; align-items: center; max-width: 520px; position: relative }
.sugg { position: absolute; top: 100%; left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); z-index: 5; max-height: 300px; overflow: auto }
.sugg div { padding: 6px 10px; cursor: pointer; font-size: 13px }
.sugg div:hover, .sugg div.act { background: color-mix(in srgb, var(--accent) 10%, transparent) }
.empty { padding: 40px; text-align: center; color: var(--muted) }
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div>
    <div class="eyebrow">SavvyETF · 지수분석 · 내부용</div>
    <h1>ACWI 종목 분석기</h1>
    <div class="links"><a href="index.html">팩터 스코어보드</a><a href="../index_monitor/web/index_monitor.html">Index Monitor</a><span class="muted" id="srcline"></span></div>
  </div>
  <div class="facts" id="facts"></div>
</header>
<nav class="tabs" role="tablist">
  <button role="tab" data-tab="market" aria-selected="true">시장 개요</button>
  <button role="tab" data-tab="screen" aria-selected="false">스크리너</button>
  <button role="tab" data-tab="detail" aria-selected="false">종목 상세</button>
  <button role="tab" data-tab="msci" aria-selected="false">MSCI 편출입</button>
  <button role="tab" data-tab="backtest" aria-selected="false">팩터 백테스트</button>
  <button role="tab" data-tab="data" aria-selected="false">데이터·방법</button>
</nav>

<section id="tab-market"></section>
<section id="tab-screen" hidden></section>
<section id="tab-detail" hidden></section>
<section id="tab-msci" hidden></section>
<section id="tab-backtest" hidden></section>
<section id="tab-data" hidden></section>
</div>

<script src="analyzer_data.js"></script>
<script src="backtest_data.js"></script>
<script>
"use strict";
const A = window.ANALYZER;
const S = A.series, M = A.meta;
const BY = Object.fromEntries(A.stocks.map(s => [s.c, s]));
const FK = [["fv","가치"],["fs","사이즈"],["fd","배당"],["fg","성장"],["fm","모멘텀"],["fq","퀄리티"]];
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isNum = v => typeof v === "number" && isFinite(v);
function f(v, d = 1, suf = "") { return isNum(v) ? v.toLocaleString("ko-KR", {minimumFractionDigits: d, maximumFractionDigits: d}) + suf : "–" }
function sg(v, d = 1, suf = "%") { if (!isNum(v)) return "–"; const c = v > 0 ? "pos" : v < 0 ? "neg" : ""; return `<span class="${c}">${v > 0 ? "+" : ""}${f(v, d)}${suf}</span>` }
function cap(v) { if (!isNum(v)) return "–"; return v >= 1e6 ? f(v / 1e6, 2) + "조$" : v >= 1e3 ? f(v / 1e3, 1) + "십억$" : f(v, 0) + "백만$" }
function heat(v, lo, hi, invert = false) {
  if (!isNum(v)) return "";
  let t = Math.max(-1, Math.min(1, (v - (lo + hi) / 2) / ((hi - lo) / 2))); if (invert) t = -t;
  const col = t >= 0 ? "var(--pos)" : "var(--neg)";
  return `background: color-mix(in srgb, ${col} ${Math.round(Math.abs(t) * 32)}%, transparent)`;
}
function msBadge(s) {
  const m = s.ms || "";
  if (m.startsWith("편출")) return `<span class="badge del" title="${esc(s.er)} 리뷰 편출, ${esc(s.ee)} 효력">편출 ${esc(s.er)}</span>`;
  if (m.startsWith("구성")) return `<span class="badge on">ACWI</span>`;
  return `<span class="badge">${esc(m || "?")}</span>`;
}
function dday(d) { const t = new Date(d + "T00:00:00+09:00"), n = new Date(M.as_of + "T00:00:00+09:00"); return Math.round((t - n) / 864e5) }

// ───────── SVG 라인 차트 (의존성 없음) ─────────
function lineChart(el, {x, series, h = 220, yfmt = v => f(v, 1), xfmt = v => v, refs = [], zeroLine = false, log = false}) {
  const W = Math.max(320, el.clientWidth || 600), H = h, P = {l: 46, r: 12, t: 10, b: 22};
  let ys = series.flatMap(s => s.y.filter(isNum)); refs.forEach(r => isNum(r.y) && ys.push(r.y));
  if (!ys.length) { el.innerHTML = `<div class="empty small">데이터 없음</div>`; return }
  let lo = Math.min(...ys), hi = Math.max(...ys); if (zeroLine) { lo = Math.min(lo, 0); hi = Math.max(hi, 0) }
  if (lo === hi) { lo -= 1; hi += 1 } const pad = (hi - lo) * 0.06; lo -= pad; hi += pad;
  const tf = log ? Math.log : v => v; const L0 = tf(lo > 0 || !log ? lo : 1e-6), L1 = tf(hi);
  const X = i => P.l + (W - P.l - P.r) * (x.length <= 1 ? 0.5 : i / (x.length - 1));
  const Y = v => P.t + (H - P.t - P.b) * (1 - (tf(v) - L0) / (L1 - L0));
  const ticks = 4, grid = [];
  for (let k = 0; k <= ticks; k++) { const v = lo + (hi - lo) * k / ticks; grid.push(`<line x1="${P.l}" x2="${W - P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${P.l - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="var(--f-mono)">${esc(yfmt(v))}</text>`) }
  const nx = Math.min(6, x.length), xl = [];
  for (let k = 0; k < nx; k++) { const i = Math.round((x.length - 1) * k / Math.max(1, nx - 1)); xl.push(`<text x="${X(i)}" y="${H - 6}" text-anchor="${k === 0 ? "start" : k === nx - 1 ? "end" : "middle"}" font-size="10" fill="var(--muted)">${esc(xfmt(x[i]))}</text>`) }
  const paths = series.map(s => {
    let d = "", pen = false;
    s.y.forEach((v, i) => { if (isNum(v) && (!log || v > 0)) { d += (pen ? "L" : "M") + X(i).toFixed(1) + "," + Y(v).toFixed(1); pen = true } else pen = false });
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w || 1.6}" ${s.dash ? `stroke-dasharray="${s.dash}"` : ""} stroke-linejoin="round"/>`;
  }).join("");
  const rl = refs.map(r => isNum(r.y) ? `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(r.y)}" y2="${Y(r.y)}" stroke="${r.color || "var(--muted)"}" stroke-dasharray="4 3"/><text x="${W - P.r}" y="${Y(r.y) - 3}" text-anchor="end" font-size="10" fill="${r.color || "var(--muted)"}">${esc(r.label || "")}</text>` : (isNum(r.x) ? `<line x1="${X(r.x)}" x2="${X(r.x)}" y1="${P.t}" y2="${H - P.b}" stroke="${r.color || "var(--muted)"}" stroke-dasharray="3 3"/><text x="${X(r.x) + 3}" y="${P.t + 10}" font-size="10" fill="${r.color || "var(--muted)"}">${esc(r.label || "")}</text>` : "")).join("");
  const z = zeroLine ? `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--muted)"/>` : "";
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img">${grid.join("")}${z}${rl}${paths}${xl.join("")}<line class="cur" y1="${P.t}" y2="${H - P.b}" stroke="var(--muted)" stroke-width="1" style="display:none"/></svg><div class="tip"></div>`;
  const svg = $("svg", el), tip = $(".tip", el), cur = $(".cur", el);
  svg.addEventListener("mousemove", e => {
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width;
    const i = Math.max(0, Math.min(x.length - 1, Math.round((px - P.l) / (W - P.l - P.r) * (x.length - 1))));
    cur.setAttribute("x1", X(i)); cur.setAttribute("x2", X(i)); cur.style.display = "";
    tip.innerHTML = `<div>${esc(xfmt(x[i], true))}</div>` + series.map(s => `<div style="color:${s.color}">${esc(s.name || "")} ${isNum(s.y[i]) ? esc(yfmt(s.y[i])) : "–"}</div>`).join("");
    tip.style.display = "block"; const tx = X(i) * r.width / W; tip.style.left = Math.min(r.width - tip.offsetWidth - 4, tx + 10) + "px"; tip.style.top = "6px";
  });
  svg.addEventListener("mouseleave", () => { tip.style.display = "none"; cur.style.display = "none" });
}
function sma(a, n) { return a.map((_, i) => { if (i < n - 1) return null; let s = 0, c = 0; for (let k = i - n + 1; k <= i; k++) if (isNum(a[k])) { s += a[k]; c++ } return c >= n * 0.8 ? s / c : null }) }
function legend(items) { return `<div class="legend">${items.map(([c, t, dash]) => `<span><i style="background:${c};${dash ? "background:repeating-linear-gradient(90deg," + c + " 0 4px,transparent 4px 7px)" : ""}"></i>${esc(t)}</span>`).join("")}</div>` }

// ───────── 상단 요약 ─────────
(function header() {
  const nr = (M.next_reviews || []).find(r => r.announce >= M.as_of);
  const all = A.stocks.filter(s => !s.xr);
  const pct = (arr, fn) => arr.length ? arr.filter(fn).length / arr.length * 100 : NaN;
  const revB = (() => { const v = all.filter(s => isNum(s.erd)); return v.reduce((a, s) => a + s.erd, 0) / v.length * 100 })();
  $("#facts").innerHTML = [
    ["기준일", M.ri_last], ["종목", A.stocks.length.toLocaleString() + ` <small class="muted">(점수 ${A.quality.n_scored.toLocaleString()})</small>`],
    ["벤치마크 3M / 12M", `${sg(M.bench_r3m)} / ${sg(M.bench_r12m)}`],
    ["MA200 위 비율", f(pct(all.filter(s => isNum(s.ma200)), s => s.ma200 > 0), 0, "%")],
    ["EPS 리비전 브레드스(3M)", sg(revB, 0, "%p")],
    ["다음 MSCI 리뷰", nr ? `${nr.review} <small class="muted">발표 ${nr.announce.slice(5)} (D-${dday(nr.announce)})</small>` : "–"],
  ].map(([k, v]) => `<div class="fact"><span class="eyebrow">${k}</span><b>${v}</b></div>`).join("");
  $("#srcline").textContent = `원자료 ${M.source} · 빌드 ${M.built_at.replace("T", " ")}`;
})();

// ───────── 탭 ─────────
const rendered = {};
function show(tab) {
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  document.querySelectorAll("section[id^=tab-]").forEach(s => s.hidden = s.id !== "tab-" + tab);
  if (!rendered[tab]) { ({market: renderMarket, screen: renderScreen, detail: renderDetail, msci: renderMsci, backtest: renderBacktest, data: renderData})[tab](); rendered[tab] = true }
  if (tab === "detail" && pendingCode) openStock(pendingCode);
  history.replaceState(null, "", "#" + tab + (tab === "detail" && current ? "/" + encodeURIComponent(current) : ""));
}
document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => show(b.dataset.tab)));
let current = null, pendingCode = null;
function goStock(code) { pendingCode = code; show("detail") }

// 공통 표
function table(el, cols, rows, {sort = null, dir = "desc", limit = 300, click = true, onRow = null} = {}) {
  const go = onRow || goStock; if (onRow) click = true;
  let st = {k: sort, d: dir}, lim = limit;
  function draw() {
    let r = rows.slice();

    if (st.chart === "q") { lineChart($("#btc1"), {x: dates, series: [...S.q.map((q, i) => ({y: btCum(i === 0 ? q1n : q), color: QC[i], name: "Q" + (i + 1), w: i === 0 || i === 4 ? 1.8 : 1.1})), {y: btCum(R.bench_ew), color: "var(--ink)", name: "유니버스", dash: "4 3", w: 1.2}], h: 260, yfmt: v => f(v, 2), xfmt: dx}); $("#btl1").innerHTML = legend([["var(--pos)", "Q1 (점수 상위)"], ["var(--muted)", "Q3"], ["var(--neg)", "Q5 (하위)"], ["var(--ink)", "유니버스 동일가중", 1]]) }
    else if (st.chart === "q1") { lineChart($("#btc1"), {x: dates, series: [{y: btCum(q1n.map((v, i) => isNum(v) && isNum(R.bench_ew[i]) ? v - R.bench_ew[i] : null)), color: "var(--accent)", name: "누적 초과"}], h: 260, yfmt: v => f(v, 2), xfmt: dx, refs: [{y: 1}]}); $("#btl1").innerHTML = "" }
    else { lineChart($("#btc1"), {x: dates, series: [{y: btCum(lsn), color: "var(--accent)", name: "롱숏"}], h: 260, yfmt: v => f(v, 2), xfmt: dx, refs: [{y: 1}]}); $("#btl1").innerHTML = "" }
    const mx = Math.max(...pq.map(p => Math.abs(p.cagr || 0)), 1);
    $("#btbars").innerHTML = pq.map((p, i) => { const v = p.cagr || 0; return `<div class="bar"><span>Q${i + 1}</span><div class="track"><div class="fill" style="${v >= 0 ? "left:50%" : "right:50%"};width:${Math.abs(v) / mx * 50}%;background:${QC[i]}"></div></div><span class="mono" style="text-align:right">${f(p.cagr, 1, "%")}</span></div>` }).join("");
    lineChart($("#btic"), {x: dates, series: [{y: btRoll(S.ic, 12), color: "var(--warn)", name: "IC 12M"}], h: 150, yfmt: v => f(v, 3), xfmt: dx, zeroLine: true});
    const rows = B.signals.filter(x => R.sig[x.key]).map(x => { const r = R.sig[x.key], q1 = btPerf(btNet(r.q[0], r.to, 2, st.cost), R.bench_ew), ls = btPerf(btNet(r.ls, r.to, 4, st.cost)), ic = r.ic_stats || {};
      return {c: x.key, key: x.key, label: x.label, kind: x.kind, q1: q1.cagr, ex: q1.excess, ir: q1.ir, ls: ls.cagr, sh: ls.sharpe, mdd: ls.mdd, ic: ic.ic_mean, ict: ic.ic_t, to: isNum(r.to_mean) ? r.to_mean * 100 : null, mono: r.spread_mono * 100} });
    $("#btcmpsub").textContent = `${BT_MODES.find(m => m[0] === st.mode)[1]} · ${st.region} · 거래비용 ${st.cost}bp · 행을 누르면 위 차트가 바뀝니다`;
    table($("#btcmp"), [{k: "label", h: "신호", f: r => esc(r.label) + (r.kind === "descriptor" ? ' <small class="muted">디스크립터</small>' : r.kind === "preset" ? ' <small class="muted">조합</small>' : "")},
      {k: "q1", h: "Q1 연수익", n: 1, f: r => f(r.q1, 1, "%")}, {k: "ex", h: "Q1 초과", n: 1, f: r => sg(r.ex), heat: r => heat(r.ex, -6, 6)}, {k: "ir", h: "IR", n: 1, f: r => f(r.ir, 2), heat: r => heat(r.ir, -1, 1)},
      {k: "ls", h: "롱숏 연수익", n: 1, f: r => sg(r.ls), heat: r => heat(r.ls, -10, 10)}, {k: "sh", h: "롱숏 샤프", n: 1, f: r => f(r.sh, 2)}, {k: "mdd", h: "롱숏 MDD", n: 1, f: r => f(r.mdd, 0, "%")},
      {k: "ic", h: "IC 평균", n: 1, f: r => f(r.ic, 3)}, {k: "ict", h: "IC t값", n: 1, t: "|t|>2 면 통계적으로 의미 있는 수준", f: r => f(r.ict, 2), heat: r => heat(r.ict, -3, 3)},
      {k: "to", h: "Q1 회전율/월", n: 1, f: r => f(r.to, 0, "%")}, {k: "mono", h: "단조성", n: 1, t: "Q1>Q2>…>Q5 순서가 맞는 비율", f: r => f(r.mono, 0, "%")}], rows, {sort: "ls", limit: 40, onRow: k => { st.sig = k; $("#bts").value = k; draw() }});
    $("#btmcsub").textContent = `같은 신호(${label(st.sig)})·지역에서 유니버스만 바꿈 · 비용 ${st.cost}bp`;
    $("#btmc").innerHTML = `<table class="mini"><thead><tr><th>유니버스</th><th class="n">롱숏 연수익</th><th class="n">샤프</th><th class="n">Q1 초과</th><th class="n">IC t</th><th class="n">종목 수</th></tr></thead><tbody>${BT_MODES.map(([m, l]) => { const rr = (B.results[m] || {})[st.region], r = rr && rr.sig[st.sig]; if (!r) return ""; const ls = btPerf(btNet(r.ls, r.to, 4, st.cost)), q1 = btPerf(btNet(r.q[0], r.to, 2, st.cost), rr.bench_ew);
      return `<tr><td>${l}</td><td class="n">${sg(ls.cagr)}</td><td class="n">${f(ls.sharpe, 2)}</td><td class="n">${sg(q1.excess, 1, "%p")}</td><td class="n">${f((r.ic_stats || {}).ic_t, 2)}</td><td class="n">${rr.n[0] ?? "–"} → ${rr.n[rr.n.length - 1] ?? "–"}</td></tr>` }).join("")}</tbody></table>`;
    const by = {}; dates.forEach((d, i) => (by[d.slice(0, 4)] = by[d.slice(0, 4)] || []).push(i));
    const comp = (a, ix) => { const v = ix.map(i => a[i]).filter(isNum); return v.length ? (v.reduce((p, x) => p * (1 + x), 1) - 1) * 100 : null };
    const yr = Object.entries(by).map(([y, ix]) => { const q1 = comp(q1n, ix), bb = comp(R.bench_ew, ix); return {y, m: ix.length, q1, b: bb, ex: isNum(q1) && isNum(bb) ? q1 - bb : null, q5: comp(S.q[4], ix), ls: comp(lsn, ix)} });
    $("#btysub").textContent = `${label(st.sig)} · Q1 은 비용 차감 후`;
    table($("#bty"), [{k: "y", h: "연도", f: r => r.y + (r.m < 12 ? ` (${r.m}개월)` : "")}, {k: "q1", h: "Q1", n: 1, f: r => sg(r.q1)}, {k: "b", h: "유니버스(EW)", n: 1, f: r => sg(r.b)}, {k: "ex", h: "초과", n: 1, f: r => sg(r.ex, 1, "%p"), heat: r => heat(r.ex, -10, 10)}, {k: "q5", h: "Q5", n: 1, f: r => sg(r.q5)}, {k: "ls", h: "롱숏", n: 1, f: r => sg(r.ls), heat: r => heat(r.ls, -15, 15)}], yr, {sort: null, click: false, limit: 20});
  }
  draw();
}

// ───────── 5. 데이터·방법 ─────────
function renderData() {
  const Q = A.quality, J = Object.entries(Q.jump_stocks || {});
  $("#tab-data").innerHTML = `<div class="grid g2">
  <div class="card"><h2>이번 파일 점검 결과</h2><div class="sub">${esc(M.source)} · 일간 ${esc(Q.ri_first)}~${esc(Q.ri_last)} · 월간 ${esc(Q.eps_first)}~${esc(Q.eps_last)}</div>
    <ul class="note">
      <li><b>시트 하단 잔여행 자동 제거</b> (월간 행 아래 남은 일간 값, 날짜가 처음 거꾸로 가는 행부터): ${["ri_m", "eps", "bps", "dps", "sal"].filter(k => Q[k + "_stale_rows_dropped"]).map(k => ({ri_m: "월간 Price", eps: "EPS", bps: "BPS", dps: "DPS", sal: "SALE"})[k] + " " + Q[k + "_stale_rows_dropped"] + "행").join(" · ") || "없음"}</li>
      ${Q.sheets ? `<li>읽은 시트: ${Object.entries(Q.sheets).map(([k, v]) => esc(v)).join(" · ")}</li>` : ""}
      <li>조회 실패(#ERROR) 시리즈: Price ${Q.ri_error_series} · EPS ${Q.eps_error_series} · BPS ${Q.bps_error_series} · DPS ${Q.dps_error_series} (러시아·선물·현금성 등)</li>
      <li>RI 0 값 ${Q.ri_zero_values}개 → 결측 처리 (BMPS 2023년 구간)</li>
      <li>하루 ±40% 이상 급변 ${Q.ri_jumps}건 / ${Q.ri_jump_stocks}종목. <b>마지막 날 급변: ${esc((Q.last_day_jumps || []).join(", ") || "없음")}</b> → 스핀오프·분할 미조정 의심, 밸류·배당 지표 제외 처리</li>
      <li>거래정지 의심(최근 30일 중 20일 이상 무변동) ${(Q.suspended || []).length}종목: ${esc((Q.suspended || []).join(", "))}</li>
      <li>시계열 시작이 늦은 종목(상장·편입 후 데이터) ${Q.ri_late_start}개</li>
      <li><b>변동성</b>: 원자료 SDN#(X,1Y)는 현지 주가 수준의 표준편차라 USD 주가로 나누면 단위가 깨짐. RI 일간수익률로 다시 계산한 값과 순위상관 ${f(Q.vol_proxy_vs_ri_spearman, 2)} → 팩터의 변동성은 RI 기준으로 교체</li>
    </ul>
    <h3 style="margin-top:12px">급변 종목</h3><p class="small mono">${J.map(([c, v]) => `${esc(c)} (${v.join(", ")}%)`).join(" · ")}</p>
  </div>
  <div class="card"><h2>계산 방법</h2><ul class="note">
    <li><b>기술적</b>: RI(배당 재투자 총수익지수, 현지통화) 일간. 수익률 1W~12M·YTD, 12-1M, 변동성(일간 로그수익률 SD×√252), MDD, 52주 고저, MA20/50/200 괴리, 골든/데드크로스(20일 내), RSI14(Wilder), MACD(12,26,9, 가격 대비 %), 볼린저 %B. 베타·상관 = 최근 104주 주간수익률 vs 벤치마크.</li>
    <li><b>추세점수 0~6</b>: 종가>MA50, 종가>MA200, MA50>MA200, MACD>시그널, 40≤RSI≤70, 3M 수익률>0. 거래량·고저가가 없어 거래량 지표는 없음.</li>
    <li><b>EPS·BPS·DPS</b>: 12개월 선행(NTM) 월간. 리비전 = 1/3/6/12개월 변화율(양수→양수만). 브레드스 = 상향 비율−하향 비율.</li>
    <li><b>근사 PER·PBR·배당 3년 위치</b>: 현재값 × 주가 상대변화 ÷ 추정치 상대변화. 주가 상대변화 = RI 변화 × (1+현재 배당수익률)^경과연수. 주가 통화와 추정치 통화가 다르면 환율 변동만큼 오차.</li>
    <li><b>팩터 모델</b> (오전 v2 기준 + 시계열 반영): ${Object.values(M.factors).map(x => `${esc(x.label)}(${x.descriptors.map(esc).join(", ")})`).join(" · ")}. 섹터×지역 중립 Z, 1/99% 윈저, ±3 절단.</li>
    <li><b>변경점</b>: 모멘텀 = RI 12-1M을 <b>국가 중앙값 대비</b>로(고인플레 통화 왜곡 제거) + EPS 3M 리비전 추가. 변동성 = RI 일간수익률. 최근 10일 ±40% 급변 종목은 밸류·배당 제외.</li>

    <li><b>벤치마크</b>: 이 파일 종목의 ACWI 비중 × 현지통화 일간수익률. 통화 효과가 섞인 근사치.</li>
  </ul>
  <h3 style="margin-top:12px">다음 Datastream 요청 권장</h3><ul class="note">
    <li>변동성: 2026-10-06 파일부터 수익률 기준 <span class="mono">SDN#(PCH#(X 1D) 1Y)*15.8</span> 반영 ✓ (분석기는 RI 일간으로 계산)</li>
    <li>국가: <span class="mono">TR.UltimateParentCountryHQ</span> 는 <b>최상위 모회사 본사</b> 국가라 MSCI 국가와 198종목 다름(아일랜드 법인 미국 기업, 인도 자회사 등) → 참고 표시만. MSCI 분류가 필요하면 상장 국가 기준 열</li>
    <li>USD 기준 수익률이 필요하면 Price 시트를 <span class="mono">X(RI)~U$</span>로 (현재 현지통화)</li>
    <li>구성종목을 최신 리뷰(${esc(M.latest_review)}) 기준으로 갱신 — 백테스트 생존 편향의 핵심은 2026-02 이전 편출 종목 부재 → 과거 시점 구성종목(편출 종목 포함) 시계열이 있으면 가장 효과 큼</li>
    <li>월간 Price 시트는 새 시트에서 DSGRID를 실행해 잔여행이 생기지 않게</li>
  </ul></div></div>
  <p class="note" style="margin-top:16px">원자료: Datastream/Refinitiv(내부 리서치용, 공개 저장소·외부 게시 금지), MSCI 공개 편출입 리스트(고지문상 DB 생성 금지 → 내부용).</p>`;
}
